version: 1.0
project:
  name: Bear.CTXPM
agents:
  - generic
update_policy:
  enabled: true
  interval: 1d
  include_self: true
dependencies:
  - name: ctxpm
    type: skill
    layout: dir
    path: .ctxpm/dependencies/skills/ctxpm
    entry: SKILL.md
    source:
      type: git
      url: https://github.com/gBearBest/Bear.CTXPM
      path: resources/skills/ctxpm
      entry: SKILL.md
    version: 8956a3932504485287fe4c4e2619f6189b4e9ce4
packages:
  - name: ctxpm-release
    type: skill
    layout: dir
    path: .ctxpm/packages/skills/ctxpm-release
    entry: SKILL.md
  - name: ctxpm-source-boundary
    type: rule
    layout: file
    path: .ctxpm/packages/rules/ctxpm-source-boundary.md
    entry: ctxpm-source-boundary.md
