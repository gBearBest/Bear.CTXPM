version: 1.0
project:
  name: Bear.CTXPM
agents:
  - generic
  - claude-code
update_policy:
  enabled: true
  interval: 1d
  include_self: true
dependencies:
  - name: ctxpm
    type: skill
    layout: dir
    path: .ctxpm/dependencies/skills/ctxpm
    entry: SKILL.md
    source:
      type: git
      url: https://github.com/gBearBest/Bear.CTXPM
      path: resources/skills/ctxpm
      entry: SKILL.md
    version: 35538b24d1333a09ba0ed4de097a40ea81c54d9d
  - name: git-commit
    type: skill
    layout: dir
    path: .ctxpm/dependencies/skills/git-commit
    entry: SKILL.md
    source:
      type: git
      url: https://github.com/github/awesome-copilot.git
      path: skills/git-commit
      ref: main
      entry: SKILL.md
    version: e24be77e6f203409cf99ab7d5a67e1540cb386d3
packages:
  - name: ctxpm-release
    type: skill
    layout: dir
    path: .ctxpm/packages/skills/ctxpm-release
    entry: SKILL.md
  - name: ctxpm-source-boundary
    type: rule
    layout: file
    path: .ctxpm/packages/rules/ctxpm-source-boundary.md
    entry: ctxpm-source-boundary.md
